<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff9fc8" />
  <meta name="description" content="Yağmur'a Harun'dan sevgi dolu küçük bir sürpriz." />
  <title>Yağmur'um 💖</title>
  <style>
    :root {
      --pink: #ff4f91;
      --pink-soft: #ffd6e8;
      --purple: #9c6cff;
      --cream: #fff8fb;
      --ink: #542039;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 16%, rgba(255,255,255,.95) 0 6%, transparent 22%),
        radial-gradient(circle at 88% 13%, rgba(255,225,240,.95) 0 7%, transparent 25%),
        linear-gradient(145deg, #ffe9f3, #e9ddff 55%, #dff6ff);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .cloud {
      position: fixed;
      border-radius: 999px;
      background: rgba(255,255,255,.62);
      filter: blur(.3px);
      opacity: .75;
      animation: cloudMove linear infinite;
      pointer-events: none;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud.one { width: 150px; height: 45px; top: 10%; left: -170px; animation-duration: 22s; }
    .cloud.two { width: 110px; height: 34px; top: 72%; left: -140px; animation-duration: 28s; animation-delay: -10s; }
    .cloud::before { width: 62px; height: 62px; left: 22px; bottom: 8px; }
    .cloud::after { width: 48px; height: 48px; right: 20px; bottom: 7px; }

    .decorations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .decor {
      position: absolute;
      font-size: clamp(22px, 5vw, 42px);
      filter: drop-shadow(0 7px 9px rgba(96, 39, 74, .12));
      animation: bob var(--speed) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .card {
      position: relative;
      z-index: 5;
      width: min(590px, 100%);
      padding: clamp(28px, 7vw, 52px) clamp(20px, 7vw, 48px);
      text-align: center;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 38px;
      background: rgba(255,255,255,.62);
      box-shadow:
        0 28px 65px rgba(111, 55, 91, .18),
        inset 0 1px 0 rgba(255,255,255,.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardIn .8s cubic-bezier(.2,.85,.25,1) both;
    }

    .cat-couple {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0;
      margin-bottom: 4px;
      filter: drop-shadow(0 10px 13px rgba(91, 39, 68, .16));
    }

    .cat {
      display: inline-block;
      font-size: clamp(62px, 16vw, 96px);
      transform-origin: bottom center;
      animation: kitty 2.2s ease-in-out infinite;
    }
    .cat:last-child { animation-delay: .25s; transform: scaleX(-1); }
    .heart-between {
      position: relative;
      z-index: 2;
      margin: 0 -10px 43px;
      font-size: clamp(31px, 8vw, 48px);
      animation: heartbeat 1.15s ease-in-out infinite;
      filter: drop-shadow(0 6px 8px rgba(255,79,145,.35));
    }

    .tiny-title {
      margin: 4px 0 9px;
      color: #a34c78;
      font-size: .8rem;
      font-weight: 900;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #6f2850;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 11vw, 5rem);
      line-height: .98;
      letter-spacing: -.045em;
      text-wrap: balance;
      text-shadow: 0 5px 20px rgba(255,255,255,.8);
    }

    .main-love {
      display: inline-block;
      margin-top: 17px;
      padding: 11px 17px;
      border-radius: 999px;
      color: white;
      background: linear-gradient(120deg, #ff4f91, #a26cff);
      box-shadow: 0 12px 24px rgba(196, 67, 131, .24);
      font-size: clamp(.95rem, 4vw, 1.12rem);
      font-weight: 900;
    }

    .sub {
      max-width: 430px;
      margin: 18px auto 0;
      color: rgba(84,32,57,.76);
      font-size: clamp(.96rem, 3.5vw, 1.1rem);
      line-height: 1.65;
    }

    .tap {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 21px;
      padding: 11px 16px;
      border: 1px solid rgba(162,108,255,.2);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      color: #7e3d63;
      font-size: .9rem;
      font-weight: 850;
      box-shadow: 0 9px 20px rgba(102,58,85,.09);
      animation: tapHint 1.8s ease-in-out infinite;
    }

    .signature {
      margin-top: 19px;
      color: #a64e79;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .counter {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 40;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 999px;
      color: #874666;
      background: rgba(255,255,255,.62);
      box-shadow: 0 7px 18px rgba(88,35,67,.1);
      backdrop-filter: blur(10px);
      font-size: .74rem;
      font-weight: 800;
    }

    .love-pop {
      position: fixed;
      z-index: 50;
      max-width: 82vw;
      padding: 12px 17px;
      pointer-events: none;
      white-space: nowrap;
      border: 2px solid white;
      border-radius: 999px;
      color: #6d234c;
      background: rgba(255,255,255,.96);
      box-shadow: 0 14px 32px rgba(91,35,67,.22);
      font-size: clamp(.88rem, 4vw, 1.06rem);
      font-weight: 950;
      transform: translate(-50%, -50%);
      animation: popUp 2.25s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .burst {
      position: fixed;
      z-index: 45;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 7px 8px rgba(80,29,60,.16));
      animation: burst var(--time) cubic-bezier(.2,.7,.2,1) forwards;
    }

    .rain {
      position: fixed;
      top: -60px;
      z-index: 2;
      pointer-events: none;
      animation: rainDown var(--fall) linear forwards;
      filter: drop-shadow(0 5px 7px rgba(91,35,67,.12));
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      18% { transform: scale(1.2) rotate(-5deg); }
      35% { transform: scale(1); }
      52% { transform: scale(1.13) rotate(5deg); }
    }
    @keyframes kitty {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes bob {
      from { transform: translateY(-8px) rotate(-7deg); }
      to { transform: translateY(10px) rotate(7deg); }
    }
    @keyframes tapHint { 50% { transform: translateY(-4px) scale(1.025); } }
    @keyframes cloudMove { to { transform: translateX(calc(100vw + 340px)); } }
    @keyframes popUp {
      0% { opacity: 0; transform: translate(-50%, -25%) scale(.62); }
      14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      25% { transform: translate(-50%, -50%) scale(1); }
      72% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -135%) scale(.94); }
    }
    @keyframes burst {
      0% { opacity: 0; transform: translate(-50%, -20%) scale(.45) rotate(0); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.25) rotate(var(--r)); }
    }
    @keyframes rainDown {
      0% { opacity: 0; transform: translateY(-30px) rotate(0); }
      10% { opacity: 1; }
      100% { opacity: 0; transform: translateY(calc(100vh + 100px)) rotate(var(--spin)); }
    }

    @media (max-width: 520px) {
      body { padding: 13px; }
      .card { border-radius: 31px; }
      .decor { font-size: 27px; }
      .counter { right: 9px; bottom: 9px; }
      .love-pop { max-width: 92vw; padding: 11px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body aria-label="Yağmur için Harun'dan sevgi sitesi">
  <div class="cloud one"></div>
  <div class="cloud two"></div>

  <div class="decorations" aria-hidden="true">
    <span class="decor" style="left:5%;top:8%;--speed:2.2s;--delay:-.4s">💗</span>
    <span class="decor" style="left:15%;top:77%;--speed:2.8s;--delay:-1.3s">🐾</span>
    <span class="decor" style="left:82%;top:8%;--speed:2.5s;--delay:-.8s">🎀</span>
    <span class="decor" style="left:88%;top:72%;--speed:2.3s;--delay:-1.5s">💖</span>
    <span class="decor" style="left:4%;top:48%;--speed:3.1s;--delay:-.2s">🌸</span>
    <span class="decor" style="left:91%;top:42%;--speed:2.7s;--delay:-1.1s">✨</span>
    <span class="decor" style="left:23%;top:5%;--speed:3s;--delay:-1.8s">😻</span>
    <span class="decor" style="left:71%;top:86%;--speed:2.6s;--delay:-.6s">🧸</span>
  </div>

  <main class="card">
    <div class="cat-couple" aria-hidden="true">
      <span class="cat">🐱</span>
      <span class="heart-between">💞</span>
      <span class="cat">🐱</span>
    </div>
    <p class="tiny-title">Harun'dan en tatlı kıza</p>
    <h1>Yağmur'um</h1>
    <div class="main-love">Harun seni çok seviyormuş 💖</div>
    <p class="sub">Ekranın herhangi bir yerine dokun. Her dokunuşunda sana kalpler, kediler ve sevgimi göndereyim.</p>
    <div class="tap"><span aria-hidden="true">👆</span> Buraya ya da istediğin yere dokun</div>
    <div class="signature">Daima senin, Harun 🐾</div>
  </main>

  <div class="counter" id="counter" aria-live="polite">Sevgi: 0 💗</div>

  <script>
    const cute = ["❤️", "💖", "💗", "💕", "💞", "🐱", "😻", "🐾", "🎀", "🌸", "✨", "🧸", "💌", "🥰"];
    let count = 0;

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    function createRain(amount = 10) {
      for (let i = 0; i < amount; i++) {
        const item = document.createElement("span");
        item.className = "rain";
        item.textContent = cute[Math.floor(Math.random() * cute.length)];
        item.style.left = `${Math.random() * 100}vw`;
        item.style.fontSize = `${18 + Math.random() * 22}px`;
        item.style.setProperty("--fall", `${3.2 + Math.random() * 2.8}s`);
        item.style.setProperty("--spin", `${(Math.random() - .5) * 720}deg`);
        item.style.animationDelay = `${Math.random() * 1.1}s`;
        document.body.appendChild(item);
        item.addEventListener("animationend", () => item.remove());
      }
    }

    function showLove(x, y) {
      count += 1;

      const message = document.createElement("div");
      message.className = "love-pop";
      message.textContent = "Harun seni çok seviyormuş ❤️";
      message.style.left = `${clamp(x, 132, innerWidth - 132)}px`;
      message.style.top = `${clamp(y, 50, innerHeight - 58)}px`;
      document.body.appendChild(message);
      message.addEventListener("animationend", () => message.remove());

      for (let i = 0; i < 13; i++) {
        const emoji = document.createElement("span");
        emoji.className = "burst";
        emoji.textContent = cute[Math.floor(Math.random() * cute.length)];
        emoji.style.left = `${x}px`;
        emoji.style.top = `${y}px`;
        emoji.style.fontSize = `${17 + Math.random() * 24}px`;
        emoji.style.setProperty("--x", `${(Math.random() - .5) * 280}px`);
        emoji.style.setProperty("--y", `${-75 - Math.random() * 185}px`);
        emoji.style.setProperty("--r", `${(Math.random() - .5) * 170}deg`);
        emoji.style.setProperty("--time", `${1.55 + Math.random() * 1.05}s`);
        document.body.appendChild(emoji);
        emoji.addEventListener("animationend", () => emoji.remove());
      }

      if (count % 3 === 0) createRain(13);
      document.getElementById("counter").textContent = `Sevgi: ${count} 💗`;
    }

    document.addEventListener("pointerdown", e => showLove(e.clientX, e.clientY));

    window.addEventListener("load", () => {
      createRain(16);
      setTimeout(() => showLove(innerWidth / 2, Math.min(innerHeight * .76, innerHeight - 72)), 650);
    });
  </script>
</body>
</html>
